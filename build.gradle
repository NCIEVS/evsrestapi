 buildscript {
  ext {
    springBootVersion = '4.1.1'
    // Remove this line to see what version is favored by springBootVersion
    // and the version brought in by spring-data-elasticsearch
    set('elasticsearch.version', '7.12.1')
  }
  repositories {
    maven { url "https://repo.spring.io/release" }
    maven { url "https://repo.spring.io/milestone" }
    maven { url "https://repo.spring.io/snapshot" }
    mavenCentral()
  }

  dependencies {
    classpath "org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}"
  }
}

plugins {
  id 'java'
  id 'eclipse'
  id 'war'
  id 'org.springframework.boot' version "${springBootVersion}"
  id 'io.spring.dependency-management' version '1.1.7'
  id 'maven-publish'
  // google java format gradle plugin
  id "com.diffplug.spotless" version "6.25.0"
  id "com.github.spotbugs" version "6.5.12"
}

repositories {
  exclusiveContent {
    forRepository {
      maven {
        name = 'hapiTestingSnapshots'
        url = 'https://central.sonatype.com/repository/maven-snapshots/'
      }
    }
    filter {
      includeVersionByRegex 'ca.uhn.hapi.fhir', 'hapi-.*', '8\\.13\\.16-.*'
    }
  }
  mavenLocal()
  mavenCentral()
  maven { url "https://repo.spring.io/release" }
  maven { url "https://repo.spring.io/milestone" }
  maven { url "https://repo.spring.io/snapshot" }
}

// Override Boot BOM httpcore5 version to fix CVE-2026-54399 / CVE-2026-54428 (HIGH)
ext['httpcore5.version'] = '5.4.3'

// Extra Properties
ext {
  // RELEASE BLOCKER: testing only. Replace with a full HAPI release BEFORE merging or deploying.
  // PR #8189 included; source revision fe490d72cf99d402df7421503572cd6550cb1a8e.
  hapiFhirVersion = '8.13.16-20261014.162006-5'
  // Parameters
  if (!project.hasProperty("inputPath")) {
    inputPath = "na"
  }
  if (!project.hasProperty("listFile")) {
    listFile = "na"
  }
  if (!project.hasProperty("terminology")) {
    terminology = "na"
  }
  if (!project.hasProperty("copyMode")) {
    copyMode = "codesab"
  }
}

// Keep transitive HAPI modules on the same timestamped snapshot as the direct dependencies.
configurations.configureEach {
  resolutionStrategy.eachDependency { details ->
    if (details.requested.group == 'ca.uhn.hapi.fhir' && details.requested.name.startsWith('hapi-')) {
      details.useVersion hapiFhirVersion
      details.because 'Use one HAPI snapshot build for upgrade testing only'
    }
  }
}

logger.warn('RELEASE BLOCKER: HAPI FHIR snapshot is for TESTING ONLY. Upgrade to a full released version BEFORE merging this branch or deploying. See README.md.')

/* Version info */
group = "gov.nih.nci.evs.api"
version = "2.6.0.RELEASE"

springBoot {
  // generate file META-INF/build-info.properties during the build
  buildInfo()
}

// Use an installed Java 25 toolchain for compilation and tests.
java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }

}

tasks.register('eclipseWebXml', Copy) {
  from(layout.projectDirectory.file('src/eclipse/WEB-INF/web.xml'))
  into(layout.projectDirectory.dir('WEB-INF'))
}

tasks.named('eclipse') {
  finalizedBy('eclipseWebXml')
}

tasks.named('eclipseWtp') {
  finalizedBy('eclipseWebXml')
}

dependencies {

  implementation "org.springframework.boot:spring-boot-starter-webmvc"
  implementation "org.springframework.boot:spring-boot-restclient"

  // Temporary compatibility for application types and dependencies that still use Jackson 2.
  implementation "org.springframework.boot:spring-boot-jackson2"

  // SpringDoc 3 is required for Spring Boot 4.
  // custom location => springdoc.swagger-ui.path=/swagger-ui/index.html
  implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1"

  implementation "org.springframework.boot:spring-boot-devtools"
  implementation "org.springframework.boot:spring-boot-starter-actuator"
  implementation "org.springframework.boot:spring-boot-starter-cache"
  implementation "org.springframework.boot:spring-boot-properties-migrator"
  implementation "org.springframework:spring-aop"

  // Align directly used HL7 converters with this HAPI build's core version.
  implementation "org.fhir:ucum:1.0.9"
  implementation "ca.uhn.hapi.fhir:org.hl7.fhir.convertors:6.10.3"

  // Spring Data 2026.0: OpenSearch 3.1.x with Spring Boot 4.1.x.
  implementation "org.opensearch.client:spring-data-opensearch:3.1.4"

  // Explicit OpenSearch common dependency; aligned by Gradle with the client dependencies.
  implementation "org.opensearch:opensearch-common:3.3.2"

  // other explicit vulnerability overrides
  implementation "org.apache.commons:commons-lang3:3.18.0"
  implementation "org.apache.thrift:libthrift:0.24.0"
  implementation "org.apache.httpcomponents.core5:httpcore5:5.4.3"
  implementation "org.apache.httpcomponents.core5:httpcore5-h2:5.4.3"
  implementation "org.thymeleaf:thymeleaf:3.1.5.RELEASE"

  //Java Mail Sender dependency
  implementation "org.springframework.boot:spring-boot-starter-mail"

  // AspectJ version is managed by Spring Boot.
  implementation "org.aspectj:aspectjweaver"
  implementation "org.apache.commons:commons-text:1.10.0"
  //implementation "org.apache.opennlp:opennlp-tools:2.2.0"

  // Upgrade ecache to use jakarta - https://groups.google.com/g/ehcache-users/c/sKfxWuTpY-U
  // See also: https://stackoverflow.com/questions/75813659/gradle-could-not-find-org-ehcacheehcache-after-upgrading-to-spring-boot-3-0-x
  // Note: ehcache 3.10.8 uses Jakarta by default, no classifier needed
  implementation "org.ehcache:ehcache:3.10.9"

  // JAXB dependencies required for ehcache with Java 9+
  // ehcache 3.10.8 still uses javax.xml.bind internally for XML parsing
  implementation 'javax.xml.bind:jaxb-api:2.3.1'
  implementation 'com.sun.xml.bind:jaxb-impl:2.3.3'

  // Apache POI for reading .xls and .xlsx files
  implementation 'org.apache.poi:poi:5.4.0'
  implementation 'org.apache.poi:poi-ooxml:5.4.0'

  //implementation 'commons-io:commons-io:2.14.0'
  // Used directly by the loaders; no longer supplied transitively by HAPI/Jena.
  implementation 'commons-cli:commons-cli:1.11.0'
  implementation 'cglib:cglib:3.3.0'
  implementation 'com.google.protobuf:protobuf-java:3.25.5'

  // fhir dependencies
  implementation "ca.uhn.hapi.fhir:hapi-fhir-base:${hapiFhirVersion}"
  implementation "ca.uhn.hapi.fhir:hapi-fhir-structures-r4:${hapiFhirVersion}"
  implementation "ca.uhn.hapi.fhir:hapi-fhir-structures-r5:${hapiFhirVersion}"
  implementation "ca.uhn.hapi.fhir:hapi-fhir-server:${hapiFhirVersion}"
  implementation("ca.uhn.hapi.fhir:hapi-fhir-jpaserver-base:${hapiFhirVersion}") {
    exclude group: "net.minidev", module: "json-smart"
    exclude group: "ca.uhn.hapi.fhir", module: "hapi-fhir-sql-migrate"
    exclude group: "org.elasticsearch.client", module: "elasticsearch-rest-high-level-client"
    exclude group: "org.elasticsearch.client", module: "elasticsearch-rest-client"
    exclude group: "org.hibernate.search"
    exclude group: "org.apache.lucene"
    exclude group: "com.github.jsonld-java", module: "jsonld-java"
    exclude group: "com.graphql-java", module: "graphql-java"
    exclude group: "org.glassfish", module: "javax.el"
    exclude group: "org.apache.logging.log4j", module: "log4j-to-slf4j"
  }
  implementation "ca.uhn.hapi.fhir:hapi-fhir-server-openapi:${hapiFhirVersion}"

  // disk-backed map implementation for hierarchy path builds
  implementation "com.h2database:h2:2.4.240"

  // Lombok dependencies (avoid using lombok for now)
  //implementation "org.projectlombok:lombok:1.18.32"
  //annotationProcessor "org.projectlombok:lombok:1.18.32"
  //compileOnly "org.projectlombok:lombok:1.18.32"

  // SpotBugs annotations
  compileOnly "com.github.spotbugs:spotbugs-annotations:4.8.6"

  /*
   * Test Dependencies
  */
  testImplementation("org.springframework.boot:spring-boot-starter-test")
  testImplementation "org.springframework.boot:spring-boot-restclient-test"
  testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
  // Use spring-boot-starter-test defaults
  // testImplementation "org.opensearch.client:spring-data-opensearch-test-autoconfigure:1.6.0"
  // testImplementation "org.junit.jupiter:junit-jupiter-params:5.10.5"
  // testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.5"
  // testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.5"
  // testRuntimeOnly "org.junit.platform:junit-platform-commons:1.10.0"
  // testRuntimeOnly "org.junit.platform:junit-platform-runner:1.10.0"
  // (avoid using lombok for now)
  // testCompileOnly "org.projectlombok:lombok:1.18.32"
  // testAnnotationProcessor "org.projectlombok:lombok:1.18.32"

}

test {
  useJUnitPlatform{
    // Perf tests are excluded from the normal run; invoke explicitly via `./gradlew perfTest`
    excludeTags 'perf'
  }
  // Args to pass when running the tests to ensure the cglib can be accessed and avoid InaccessibleObjectException
  jvmArgs("-Xmx8G", "--add-opens", "java.base/java.lang=ALL-UNNAMED")
  // Set the active profile to use our application-test.yml file from test resources
  systemProperty("spring.profiles.active", "test")
  /*
   * Configure gradle to show standard out and standard error
   * of the test JVM(s) on the console
   */
  testLogging.showStandardStreams = true
}

// Perf-tagged tests against a live local graphdb/opensearch stack.
// Excluded from the default `test` task; run explicitly with `./gradlew perfTest`.
task perfTest(type: Test) {
  useJUnitPlatform{
    includeTags 'perf'
  }
  jvmArgs("-Xmx8G", "--add-opens", "java.base/java.lang=ALL-UNNAMED")
  systemProperty("spring.profiles.active", "test")
  testLogging.showStandardStreams = true
  outputs.upToDateWhen { false }
}

// Format the code using google-java-format: https://github.com/diffplug/spotless/blob/main/plugin-gradle/README.md
// Use ./gradlew spotlessCheck to run checks
// Use ./gradlew spotlessApply to perform fixes
spotless {
  format 'misc', {
    // define the files to apply `misc` to
    target '*.gradle', '.gitattributes', '.gitignore'

    // define the steps to apply to those files
    trimTrailingWhitespace()
    indentWithSpaces(2) // or spaces. Takes an integer argument if you don't like 4
    endWithNewline()
  }
  java {
    target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
    // apply a specific flavor of google-java-format
    googleJavaFormat('1.28.0').reflowLongStrings().formatJavadoc(true).reorderImports(true).groupArtifact('com.google.googlejavaformat:google-java-format')
    removeUnusedImports()
    // fix formatting of type annotations
//        formatAnnotations()
  }
}

// SpotBugs
spotbugs {
    ignoreFailures = false
    showStackTraces = true
    showProgress = true
    excludeFilter = file("config/spotbugs/excludeFilter.xml")
    // jvmArgs = [ "-Duser.language=ja" ]
}
spotbugsMain {
    reports {
        html {
            enabled = true
            outputLocation = file("$buildDir/reports/spotbugs/main/spotbugs.html")
            stylesheet = 'fancy-hist.xsl'
        }
    }
}
spotbugsTest {
    reports {
        html {
            enabled = true
            outputLocation = file("$buildDir/reports/spotbugs/main/spotbugs.html")
            stylesheet = 'fancy-hist.xsl'
        }
    }
}

// # for this, the cuis with listed sources will have hierarchies computed
// ./gradlew rrfSample -Pterminology=NCIMTH,MDR,ICD10CM,ICD9CM,LNC,SNOMEDCT_US,RADLEX,PDQ,ICD10,HL7V3.0 -PlistFile=src/main/resources/cuis-202508.txt -PinputPath=../data/NCIM/META [-PcopyMode=codesab|cui]
tasks.register('rrfSample', JavaExec) {
  classpath = sourceSets.main.runtimeClasspath
  main = "gov.nih.nci.evs.api.service.SamplingApplication"
  systemProperties System.getProperties()
  // arguments to pass to the application
  args("rrfSample", inputPath, listFile, terminology, copyMode)
  jvmArgs "-Xmx8G"
}


tasks.register('zipFile', Zip) {
  def zipFileRootDirectory = "${project.name}-${project.version}"

  from('src/main/bin') {
    filePermissions {
      unix('rwxr-xr-x')
    }
    into "$zipFileRootDirectory/bin"
  }
  from("$buildDir/main/bin") {
    filePermissions {
      unix('rwxr-xr-x')
    }
    include '**/createDirectoriesForWorkspace.pl'
    into "$zipFileRootDirectory/bin"
  }
  from('src/main/config') {
    into "${archiveBaseName}-${project.version}/config"
    into "$zipFileRootDirectory/config"
  }
  from("$buildDir/main/config") {
    include '**/createDirectories.properties'
    into "$zipFileRootDirectory/config"
  }
  from("$buildDir/libs") {
    include '*.*'
    into "$zipFileRootDirectory/lib"
  }
  rename { String fileName ->
    fileName.replace("-${project.version}", "")
  }
}

// NOTE: this causes LoaderServiceImpl to launch when run via -jar
bootJar {
  manifest {
    attributes 'Start-Class': 'gov.nih.nci.evs.api.service.LoaderServiceImpl'
  }
  // Handle duplicate copying more than one file to the same destination
  // https://docs.gradle.org/8.2.1/dsl/org.gradle.api.tasks.Copy.html#org.gradle.api.tasks.Copy:duplicatesStrategy
  duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
}

zipFile.dependsOn = [bootWar, bootJar]
build.dependsOn = [spotlessCheck, spotbugsMain, spotbugsTest, test, bootWar, bootJar, zipFile]
publishToMavenLocal.dependsOn = [bootWar, bootJar, zipFile]

dependencyLocking {
  lockAllConfigurations()
}

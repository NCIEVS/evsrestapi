name: Makefile CI

permissions:
  contents: read

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master", "develop", "develop-*" ]

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Run unit tests for PR
        run: make test-unit
      - name: Shared library checks
        run: ./gradlew :evsrestapi-core:check
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
            evsrestapi-core/build/reports/tests/
            evsrestapi-core/build/test-results/
          if-no-files-found: ignore
